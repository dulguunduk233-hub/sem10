<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects Grid</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.sem7.css"></head>
<body data-page="projects"><nav id="sidebar"></nav><div id="main"><header id="topbar"></header><div class="content">

<h5 class="mb-3">Projects Grid</h5>
<div class="card"><div class="card-body">
 <div class="row g-3" id="grid"></div>
</div></div>

</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="layout.sem7.js"></script>
<script>
const P=[['Design','Dashboard UI','seminar 7',2],
['Design','Ecommerce App','seminar 7',3],
['Development','Calendar App','seminar 7',1],
['Development','Kanban Board','seminar 7',1],
['Development','Authentication','seminar 7',1],
['Design','Redesign - Landing Page','seminar 7',2],
['Design','Brand Logo Design','seminar 7',4],
['Development','Chat App','seminar 7',3]];
const cols=['#8b6f5a','#5a7d8b','#3b82d6','#5ab37a'];

grid.innerHTML=P.map(p=>`
<div class="col-md-6 col-xl-3">
    <div class="card border h-100 shadow-none">
        <div class="card-body">
 <span class="badge badge-soft">${p[0]}</span>
 <h6 class="mt-2 mb-1">${p[1]}</h6>
 <p class="text-muted mb-3">${p[2]}</p><hr>
 <div class="d-flex align-items-center"><small class="me-2">Team :</small>${Array.from({length:p[3]},(_,i)=>`<span class="avatar sm" style="background:${cols[i%4]}">${'ABCD'[i]}</span>`).join('')}</div>
</div></div></div>`).join('');
</script></body></html>
