<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sem7</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.sem7.css"></head>
<body data-page="users"><nav id="sidebar"></nav><div id="main"><header id="topbar"></header><div class="content">

<h5 class="mb-3">User List</h5>

<div class="card"><div class="card-body">
 <h6 class="mb-3">Contact List</h6>
 <table class="table align-middle">
  <thead><tr><th><input type="checkbox" class="form-check-input"></th><th>Name</th><th>Position</th><th>Email</th><th>Tags</th></tr></thead>
  <tbody id="rows"></tbody></table>
</div></div>

</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="layout.sem7.js"></script>
<script>
const users=[['Donald Risher','UI/UX Designer',['Photoshop','Illustrator']],
['Helen Barron','Frontend Developer',['Html','Css','2 + more']],
['Philip Theroux','Backend Developer',['Php','Java','Python']],
['Justin McClain','Full Stack Developer',['Ruby','Php','2 + more']],
['Sharon Carver','Frontend Developer',['Html','Css','2 + more']],
['Jody Tondreau','UI/UX Designer',['Photoshop','Illustrator']],
['Dennis Goulet','Graphic Designer',['Photoshop','Illustrator']],
['Cecelia Farrell','Angular Developer',['Php','Javascript']],
['Peter Dryer','Web Designer',['Html','Css','2 + more']],
['Gerald Moyer','Backend Developer',['Php','Javascript']]];
const cols=['#8b6f5a','#5a7d8b','#7a5a8b','#5a8b6a','#8b5a5a'];

rows.innerHTML=users.map((u,i)=>`<tr><td><input type="checkbox" class="form-check-input"></td>
<td><span class="avatar me-2" style="background:${cols[i%5]}">${u[0].split(' ').map(w=>w[0]).join('')}</span><b>${u[0]}</b></td>
<td class="text-muted">${u[1]}</td>
<td class="text-muted">${u[0].replace(' ','')}@Dashonic.com</td>
<td>${u[2].map(t=>`<span class="badge badge-soft me-1">${t}</span>`).join('')}</td></tr>`).join('');
</script></body></html>
