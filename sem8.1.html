<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sem8</title>
<style>
  body { font-family: Arial, sans-serif; 
         background: #f2f4f7; 
         margin: 0; 
         padding: 24px; }
  .card { background: #fff; 
          max-width: 900px; 
          margin: 0 auto; 
          padding: 24px; 
          border-radius: 8px; }
  h2 { text-align: center;
       margin-top: 0; }
  .layout { display: flex; 
            gap: 24px; 
            flex-wrap: wrap; }
  form { display: flex; 
         flex-direction: column; 
         gap: 12px; 
         width: 240px; }
  input { padding: 10px; 
          border: 2px solid #4da6ff; 
          border-radius: 8px; 
          background: #eee; 
          font-size: 14px; }
  button#add { align-self: flex-end; 
               padding: 10px 24px; 
               border: 2px solid #0a84ff; 
               background: #cfe8ff;
               border-radius: 8px; 
               font-weight: bold; 
               cursor: pointer; }
  table { flex: 1; 
          min-width: 360px; 
          border-collapse: collapse; 
          background: #eee; }
  th, td { border: 2px solid #4da6ff; 
           padding: 10px; 
           text-align: center; }
  .del { background: #f5c2c2; 
         color: red; 
         border: none; 
         border-radius: 4px; 
         cursor: pointer; 
         padding: 4px 8px; }
         
</style>
</head>
<body>
  <div class="card">
    <h2>Хэрэглэгчийн бүртгэл</h2>
    <div class="layout">
      <form onsubmit="return false">
        <input id="lastname" placeholder="Овог . . .">
        <input id="firstname" placeholder="Нэр . . .">
        <input id="age" type="number" placeholder="Нас . . .">
        <button id="add" type="button">Бүртгэх</button>
      </form>

      <table>
        <thead>
          <tr><th>№</th><th>Овог</th><th>Нэр</th><th>Нас</th><th>Үйлдэл</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

<script>
 
  const lastname  = document.getElementById("lastname");
  const firstname = document.getElementById("firstname");
  const age       = document.getElementById("age");
  const addBtn    = document.getElementById("add");
  const tbody     = document.getElementById("tbody");

  
  function renumber() {
    const rows = tbody.getElementsByTagName("tr");
    for (let i = 0; i < rows.length; i++) {
      rows[i].firstElementChild.innerText = i + 1;
    }
  }

  addBtn.onclick = function () {
    
   
    const tr = document.createElement("tr");
    const values = ["", lastname.value, firstname.value, age.value];

    values.forEach(function (v) {
      const td = document.createElement("td");
      td.innerText = v;              
      tr.appendChild(td);            
    });

   
    const tdAction = document.createElement("td");
    const delBtn = document.createElement("button");
    delBtn.innerText = "✕";
    delBtn.className = "del";
    delBtn.onclick = function () {
      tr.remove();                   
      renumber();
    };
    tdAction.appendChild(delBtn);
    tr.appendChild(tdAction);

    tbody.appendChild(tr);
    renumber();

    
    lastname.value = "";
    firstname.value = "";
    age.value = "";
    lastname.focus();
  };
</script>
</body>
</html>
