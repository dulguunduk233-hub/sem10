<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zurag guilgedeg</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">

  <style>
    /* Same height for every image so the carousel doesn't jump */
    .carousel-item img {
      height: 450px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="container py-4">

    <!-- MOBILE: stacked images (hidden from md and up) -->
    <div class="d-md-none">
      <img src="https://static1.thegamerimages.com/wordpress/wp-content/uploads/2023/01/mew-2.jpg" class="d-block w-100 mb-2" alt="Image 1">
      <img src="https://wallpapers.com/images/hd/mew-background-rqz03ybv9nlaw4vr.jpg" class="d-block w-100 mb-2" alt="Image 2">
      <img src="https://wallpapers.com/images/hd/mew-in-cloudy-sky-1pdmz91wy4soim6p.jpg" class="d-block w-100" alt="Image 3">
    </div>

    <!-- DESKTOP: carousel (hidden below md) -->
    <div id="myCarousel" class="carousel slide d-none d-md-block" data-bs-ride="carousel">

      <!-- Dots -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>

      <!-- Slides -->
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://static1.thegamerimages.com/wordpress/wp-content/uploads/2023/01/mew-2.jpg" class="d-block w-100" alt="Slide 1">
          
        </div>

        <div class="carousel-item">
          <img src="https://wallpapers.com/images/hd/mew-background-rqz03ybv9nlaw4vr.jpg" class="d-block w-100" alt="Slide 2">
         
        </div>

        <div class="carousel-item">
          <img src="https://wallpapers.com/images/hd/mew-in-cloudy-sky-1pdmz91wy4soim6p.jpg" class="d-block w-100" alt="Slide 3">
          
        </div>
      </div>

      <!-- Prev / Next arrows -->
      <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

  </div>

  <!-- Bootstrap JS (needed for the carousel) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
          crossorigin="anonymous"></script>
</body>
</html>
