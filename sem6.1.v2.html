<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ungiin husnegtuud</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">

  <style>
    .box {
      height: 80px;
      border-radius: 12px;
    }
    .green { background: #00ff9d; }
    .blue  { background: #66b8ff; }
    .red   { background: #ff5757; }
    .gray  { background: #d9d9d9; }
  </style>
</head>
<body>

  <div class="container py-4">
    <div class="row g-3">

      <!-- Green 1: half on mobile, 3/12 on desktop -->
      <div class="col-6 col-md-3">
        <div class="box green"></div>
      </div>

      <!-- Green 2: half on mobile, 3/12 on desktop -->
      <div class="col-6 col-md-3">
        <div class="box green"></div>
      </div>

      <!-- Blue: full on mobile, 6/12 on desktop -->
      <div class="col-12 col-md-6">
        <div class="box blue"></div>
      </div>

      <!-- Red 1: full on mobile, half on desktop -->
      <div class="col-12 col-md-6">
        <div class="box red"></div>
      </div>

      <!-- Red 2: half on mobile, half on desktop -->
      <div class="col-6 col-md-6">
        <div class="box red"></div>
      </div>

      <!-- Gray: half on mobile, full on desktop -->
      <div class="col-6 col-md-12">
        <div class="box gray"></div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
          crossorigin="anonymous"></script>
</body>
</html>
