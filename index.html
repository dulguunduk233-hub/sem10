<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.sem7.css"></head>
<body data-page="analytics"><nav id="sidebar"></nav><div id="main"><header id="topbar"></header><div class="content">

<h5 class="mb-3">Analytics</h5>
<div class="row g-3">
 <div class="col-lg-9"><div class="card h-100"><div class="card-body">
  <h6>Daily Active Users</h6>
  <div class="d-flex gap-4 my-2">
   <div><small class="text-muted">Total Visitors</small><div class="fs-5 fw-bold">18.2 k</div></div>
   <div><small class="text-muted">Sessions</small><div class="fs-5 fw-bold text-primary">3.85 k</div></div>
   <div><small class="text-muted">Bounce Rate</small><div class="fs-5 fw-bold">24.03 %</div></div>
   <div><small class="text-muted">Users</small><div class="fs-5 fw-bold">52 k</div></div>
  </div>
  <canvas id="line" height="110"></canvas>
 </div></div></div>

 <div class="col-lg-3"><div class="card h-100"><div class="card-body">
  <h6>User Activity</h6><canvas id="bar"></canvas>
 </div></div></div>

 <div class="col-lg-4"><div class="card h-100"><div class="card-body">
  <h6 class="mb-3">Visitors by Browser</h6>
  <div class="mb-3"><div class="d-flex justify-content-between"><span>Chrome</span><b>82 %</b></div><div class="progress" style="height:5px"><div class="progress-bar" style="width:82%"></div></div></div>
  <div class="mb-3"><div class="d-flex justify-content-between"><span>Firefox</span><b>70 %</b></div><div class="progress" style="height:5px"><div class="progress-bar" style="width:70%"></div></div></div>
  <div><div class="d-flex justify-content-between"><span>Safari</span><b>76 %</b></div><div class="progress" style="height:5px"><div class="progress-bar" style="width:76%"></div></div></div>
 </div></div></div>

 <div class="col-lg-4"><div class="card h-100"><div class="card-body">
  <h6>Visitors Source</h6><div style="max-width:200px;margin:auto"><canvas id="donut"></canvas></div>
 </div></div></div>

 <div class="col-lg-4"><div class="card h-100"><div class="card-body">
  <h6 class="mb-3">Traffic Source</h6>
  <div class="mb-3">#1 www.abc.com<br><b>3.82 k</b></div>
  <div class="mb-3">#2 www.xyz.com<br><b>3.04 k</b></div>
  <div>#3 www.abc123.com<br><b>2.64 k</b></div>
 </div></div></div>
</div>

</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="layout.sem7.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
const B='#3b82d6';
new Chart(line,{type:'line',data:{labels:['01 Jan','02 Jan','03 Jan','04 Jan','05 Jan','06 Jan','07 Jan','08 Jan','09 Jan','10 Jan','11 Jan','12 Jan'],
 datasets:[{data:[62,40,50,75,52,28,45,35,58,42,32,38],borderColor:B,backgroundColor:'rgba(59,130,214,.08)',fill:true,tension:.4}]},
 options:{plugins:{legend:{display:false}},scales:{y:{display:false}}}});
new Chart(bar,{type:'bar',data:{labels:['Jan','Feb','Mar','Apr','May','Jun'],datasets:[
 {label:'Previous Month',data:[30,15,28,22,40,25],backgroundColor:'#b9d6f2'},{label:'This Month',data:[60,32,56,45,65,52],backgroundColor:B}]},
 options:{plugins:{legend:{position:'top',labels:{boxWidth:10}}},scales:{x:{stacked:true},y:{stacked:true}}}});
new Chart(donut,{type:'doughnut',data:{labels:['Social','Direct','Others'],datasets:[{data:[50,25,25],backgroundColor:[B,'#eef0f4','#7ac6ec']}]},
 options:{cutout:'65%',plugins:{legend:{position:'bottom',labels:{boxWidth:10}}}}});
</script></body></html>
