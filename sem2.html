<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
</head>

<body style="margin:0;
             min-height:100vh;
             display:flex;
             justify-content:center;
             align-items:center;
             font-family:Arial;
             background-image:url('https://i.pinimg.com/1200x/d1/65/a5/d165a5b9298269fb03868cdc167d5d81.jpg');
             background-size:cover;">

  <div style="position:relative;
              width:900px;
              min-height:600px;
              background:#fff;
              border-radius:24px;
              overflow:hidden;">

    <!-- LEFT SIDE -->
    <div style="width:55%;
                padding:40px 56px;
                box-sizing:border-box;">

      <h1 style="color:#d9829f; font-size:36px; margin:30px 0 10px 0;">Sign Up</h1>

      <form action="#" 
            method="post" 
            style="display:flex; 
                   flex-direction:column;">

        <label for="su-name" 
               style="font-size:12px; 
                      margin-top:12px;">Full name</label>
        <input type="text" 
               id="su-name" 
               name="name" required
               style="padding:10px 12px; margin-top:4px; border:none; background:#bcd9e6; font-size:12px;">

        <label for="su-email" 
               style="font-size:12px; 
                      margin-top:12px;">Email</label>
        <input type="email" 
               id="su-email" 
               name="email" required
               style="padding:10px 12px; margin-top:4px; border:none; background:#bcd9e6; font-size:12px;">

        <label for="su-password" 
               style="font-size:12px; margin-top:12px;">Password</label>
        <input type="password" 
               id="su-password" 
               name="password" 
               minlength="8" required
               style="padding:10px 12px; margin-top:4px; border:none; background:#bcd9e6; font-size:12px;">

        <label for="su-confirm" 
               style="font-size:12px; margin-top:12px;">Confirm password</label>
        <input type="password" 
               id="su-confirm" 
               name="confirm" 
               minlength="8" required
               style="padding:10px 12px; margin-top:4px; border:none; background:#bcd9e6; font-size:12px;">

        <input type="submit" 
               value="SIGN UP →"
               style="align-self:center; margin-top:24px; padding:10px 36px; border:none; border-radius:20px; background:#d9829f; color:#fff; font-size:12px; cursor:pointer;">
      </form>

      <p style="text-align:center; font-size:12px; color:#777; margin-top:18px;">
        Already have an account?
        <a href="sem3.nevtreh.html" style="color:#d9829f; text-decoration:none;">Log in</a>
      </p>

    </div>

    
    <!-- RIGHT SIDE -->
<div style="position:absolute; top:0; right:0; width:45%; height:100%;">
  <img src="https://i.pinimg.com/1200x/a3/d2/e6/a3d2e6d96769d634e7a3a8e038fe3fe1.jpg"
       alt="zurag"
       style="width:100%; height:100%; object-fit:cover; display:block;">
</div>

  </div>

</body>
</html>
